name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A53F2F: ${{ secrets.A53F2F }}
          BE6222: ${{ secrets.BE6222 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A53F2F', '')
          tag_b = os.environ.get('BE6222', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- c4acd46cbee282f69c021fcb4b468602f3212c9ae6 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- f4b8a1357a2e18490327086c758ea30b580427 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
